name: CPU evidence reconstruction
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements/cpu-ci.txt
      - name: Check publication boundaries and current command index
        run: |
          python -m rtpa_research.publication_build --root .
          python scripts/check_current_readme.py --root .
          python -m rtpa_research --help
          python -m rtpa_research --version
      - run: python -m unittest discover -s tests -v
      - run: python -m pytest -q tests/test_diag_r4_cost.py tests/test_diag_r4_cost_analysis.py tests/test_diag_r4_cost_renderer.py
      - run: python -m rtpa_research verify --out recomputed
      - name: Run the model-free demonstration and historical FA_CODE reconstruction
        run: |
          python -m rtpa_research demo --out recomputed-upgrade-demo.json
          python -m rtpa_research.fa_evidence --out recomputed-fa
          python -m rtpa_research single-write-evidence --out recomputed-single-write
          python -m rtpa_research.screen_report --out recomputed-single-write-screen
          python -m rtpa_research.b2_mix_report --check-expected --out recomputed-b2-mix
          python scripts/audit_b2_mix.py --out /tmp/rtpa-b2-mix-independent.json
      - name: Reconstruct the published upgrade evidence without GPU execution
        run: python scripts/reproduce_upgrade.py --root . --write-generated recomputed-upgrade --verify
      - name: Independently audit token scalars and frozen numerical contracts
        run: |
          python scripts/audit_upgrade_scalars.py --root . --recomputed-dir recomputed-upgrade --out /tmp/rtpa-independent-scalars.json
          python scripts/check_upgrade_contract.py --root . --out /tmp/rtpa-upgrade-contract.json
      - name: Reconstruct stable-codec DIAG and check independent observations
        run: |
          python -m rtpa_research.diag_r2_analysis --public --out recomputed-diag-r2 --expected results/diag_r2/recomputed_expected.json
          python scripts/audit_diag_r2_observations.py --run data/benchmarks/diag_r2 --analysis recomputed-diag-r2 --out /tmp/rtpa-r2-observations.json
          python scripts/audit_diag_r2_dependencies.py --run data/benchmarks/diag_r2 --out /tmp/rtpa-r2-dependencies.json
          python scripts/audit_diag_r2_accounting.py --self-test
          # One archived SIGTERM timing attempt has bounded, not exact, trailing calls.
          # The only full retry was closed by the external-GPU concurrency guard.
          # Accept narrowly validated bookkeeping, never full timing or generic failures.
          python scripts/audit_diag_r2_accounting.py --root . --run data/benchmarks/diag_r2 --out /tmp/rtpa-r2-accounting.json --allow-bounded-interruption --allow-documented-timing-incomplete
          python scripts/check_diag_r2_install.py --out /tmp/rtpa-r2-source-resolution.json
          python scripts/init_diag_r2_replay.py --out /tmp/rtpa-r2-inputs-only
          python scripts/summarize_diag_r2_memory.py --run data/benchmarks/diag_r2 --out /tmp/rtpa-r2-memory-tables
          cmp results/diag_r2/memory_tables.md /tmp/rtpa-r2-memory-tables/memory_tables.md
          cmp results/diag_r2/memory_display.json /tmp/rtpa-r2-memory-tables/memory_display.json
          python scripts/render_diag_r2_assessment.py --run data/benchmarks/diag_r2 --analysis recomputed-diag-r2 --out /tmp/rtpa-r2-assessment
          cmp results/diag_r2/assessment.json /tmp/rtpa-r2-assessment/assessment.json
          cmp results/diag_r2/cal_fixed_mask.md /tmp/rtpa-r2-assessment/cal_fixed_mask.md
          cmp results/diag_r2/quality_details.md /tmp/rtpa-r2-assessment/quality_details.md
      - name: Reconstruct fixed-mask codec feedback without model inference
        run: |
          python scripts/codec_feedback/aggregate.py --run data/benchmarks/codec_feedback --out /tmp/rtpa-feedback
          python scripts/codec_feedback/verify.py --root . --out /tmp/rtpa-feedback-verification.json
      - name: Reconstruct attribution, failures and declared CPU evidence
        run: |
          python -m rtpa_research.maintenance_verify --root . --out /tmp/rtpa-r4-verification.json
          python scripts/check_diag_r4_install.py --root . --out /tmp/rtpa-r4-resolved.json
          python scripts/render_diag_r4.py --root . --out /tmp/rtpa-r4-render
          cmp results/diag_r4/benchmark_tables.md /tmp/rtpa-r4-render/benchmark_tables.md
          cmp results/diag_r4/assessment.json /tmp/rtpa-r4-render/assessment.json
          python scripts/render_diag_r4_cost.py --root . --out /tmp/rtpa-r4-cost-tables.md
          cmp results/diag_r4/cost_tables.md /tmp/rtpa-r4-cost-tables.md
          python scripts/account_diag_r4.py --root . --out /tmp/rtpa-r4-accounting.json
          cmp results/diag_r4/execution_accounting.json /tmp/rtpa-r4-accounting.json
          python scripts/build_diag_r4_claims.py --root . --out /tmp/rtpa-r4-claims.json
          cmp results/diag_r4/claims.json /tmp/rtpa-r4-claims.json
      - name: Verify grid feedback without parent captures or model execution
        # Existing evidence jobs remain separate; these are CPU observations,
        # not a replay of local captures or a GPU/model benchmark.
        run: |
          python -m rtpa_research.grid_verify --out /tmp/rtpa-grid-check.json
          python -m rtpa_research.grid_candidate_verify --out /tmp/rtpa-grid-candidate-check.json
          python -m rtpa_research.grid_report --out /tmp/rtpa-grid-tables
          cmp results/grid_feedback/tables.md /tmp/rtpa-grid-tables/tables.md
          cmp results/grid_feedback/candidate_summary.json /tmp/rtpa-grid-tables/candidate_summary.json
          python scripts/render_grid_cycle.py --root . --out /tmp/rtpa-grid-final
          cmp results/grid_feedback/decision.json /tmp/rtpa-grid-final/decision.json
          cmp results/grid_feedback/execution_accounting.json /tmp/rtpa-grid-final/execution_accounting.json
          cmp results/grid_feedback/verification.json /tmp/rtpa-grid-final/verification.json
      - name: Build and install the public wheel with all selected evidence
        run: |
          python scripts/check_publication_archives.py --root . --out /tmp/rtpa-package-boundary.json
          python -m build --wheel --no-isolation
          python -m venv /tmp/rtpa-wheel-test
          wheel_file="$(realpath dist/*.whl)"
          cd /tmp
          # Do not let source-tree egg-info masquerade as an installed package.
          PYTHONPATH="" /tmp/rtpa-wheel-test/bin/python -m pip install -c "$GITHUB_WORKSPACE/requirements/cpu-common.txt" "$wheel_file"
          PYTHONPATH="" /tmp/rtpa-wheel-test/bin/python -c 'import pathlib, sys, rtpa_research; assert pathlib.Path(rtpa_research.__file__).is_relative_to(sys.prefix)'
      - name: Verify installed evidence without the source checkout on PYTHONPATH
        working-directory: /tmp
        env:
          PYTHONPATH: ""
        run: |
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research --help
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research --version
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research verify --out /tmp/rtpa-installed-recomputed
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research demo --out /tmp/rtpa-installed-demo.json
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.fa_evidence --out /tmp/rtpa-installed-fa
          upgrade_script="$(/tmp/rtpa-wheel-test/bin/python -c 'from rtpa_research.resources import evidence_root; print(evidence_root() / "scripts/reproduce_upgrade.py")')"
          /tmp/rtpa-wheel-test/bin/python "$upgrade_script" --write-generated /tmp/rtpa-installed-upgrade --verify
          evidence_root="$(/tmp/rtpa-wheel-test/bin/python -c 'from rtpa_research.resources import evidence_root; print(evidence_root())')"
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.b2_mix_report --check-expected --out /tmp/rtpa-installed-b2-mix
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/audit_b2_mix.py" --root "$evidence_root" --out /tmp/rtpa-installed-b2-mix-independent.json
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.diag_r2_analysis --public --out /tmp/rtpa-installed-r2 --expected "$evidence_root/results/diag_r2/recomputed_expected.json"
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/audit_diag_r2_observations.py" --run "$evidence_root/data/benchmarks/diag_r2" --analysis /tmp/rtpa-installed-r2 --out /tmp/rtpa-installed-r2-observations.json
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/audit_diag_r2_accounting.py" --self-test
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/audit_diag_r2_accounting.py" --root "$evidence_root" --run "$evidence_root/data/benchmarks/diag_r2" --out /tmp/rtpa-installed-r2-accounting.json --allow-bounded-interruption --allow-documented-timing-incomplete
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/check_diag_r2_install.py" --require-installed --out /tmp/rtpa-installed-r2-resolution.json
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/init_diag_r2_replay.py" --out /tmp/rtpa-installed-r2-inputs-only
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/summarize_diag_r2_memory.py" --run "$evidence_root/data/benchmarks/diag_r2" --out /tmp/rtpa-installed-r2-memory-tables
          cmp "$evidence_root/results/diag_r2/memory_tables.md" /tmp/rtpa-installed-r2-memory-tables/memory_tables.md
          cmp "$evidence_root/results/diag_r2/memory_display.json" /tmp/rtpa-installed-r2-memory-tables/memory_display.json
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/render_diag_r2_assessment.py" --run "$evidence_root/data/benchmarks/diag_r2" --analysis /tmp/rtpa-installed-r2 --out /tmp/rtpa-installed-r2-assessment
          cmp "$evidence_root/results/diag_r2/assessment.json" /tmp/rtpa-installed-r2-assessment/assessment.json
          cmp "$evidence_root/results/diag_r2/cal_fixed_mask.md" /tmp/rtpa-installed-r2-assessment/cal_fixed_mask.md
          cmp "$evidence_root/results/diag_r2/quality_details.md" /tmp/rtpa-installed-r2-assessment/quality_details.md
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/codec_feedback/verify.py" --root "$evidence_root" --out /tmp/rtpa-installed-feedback-verification.json
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.maintenance_verify --root "$evidence_root" --out /tmp/rtpa-installed-r4.json
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/check_diag_r4_install.py" --root "$evidence_root" --out /tmp/rtpa-installed-r4-resolution.json
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/account_diag_r4.py" --root "$evidence_root" --out /tmp/rtpa-installed-r4-accounting.json
          cmp "$evidence_root/results/diag_r4/execution_accounting.json" /tmp/rtpa-installed-r4-accounting.json
          /tmp/rtpa-wheel-test/bin/python "$evidence_root/scripts/render_diag_r4_cost.py" --root "$evidence_root" --out /tmp/rtpa-installed-r4-cost.md
          cmp "$evidence_root/results/diag_r4/cost_tables.md" /tmp/rtpa-installed-r4-cost.md
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.grid_verify --out /tmp/rtpa-installed-grid-check.json
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.grid_candidate_verify --out /tmp/rtpa-installed-grid-candidate-check.json
          /tmp/rtpa-wheel-test/bin/python -m rtpa_research.grid_report --out /tmp/rtpa-installed-grid-tables
          cmp "$evidence_root/results/grid_feedback/tables.md" /tmp/rtpa-installed-grid-tables/tables.md
          cmp "$evidence_root/results/grid_feedback/candidate_summary.json" /tmp/rtpa-installed-grid-tables/candidate_summary.json
  codec-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      OMP_NUM_THREADS: "2"
      MKL_NUM_THREADS: "2"
      OPENBLAS_NUM_THREADS: "2"
      PYTHONPATH: src
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - name: Install CPU-only numerical dependencies, not model weights
        run: |
          # Separate from the packaging job: no wheel/sdist building here.
          python -m pip install -c requirements/codec-ci.txt numpy==1.26.4 tokenizers==0.22.2 scipy==1.17.1 transformers==5.9.0 pytest==9.1.1 setuptools==79.0.1
          python -m pip install -c requirements/codec-ci.txt torch==2.11.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Check stable codecs and reference-equivalent optimizations on CPU
        run: |
          python -m unittest discover -s tests -p 'test_maintenance_boundaries.py' -v
          python -m unittest discover -s tests -p 'test_codec_r2*.py' -v
          python -m unittest discover -s tests -p 'test_diag_r2*.py' -v
          python examples/diag_r2.py --profile R2_OFFSET --out /tmp/r2-offset-api.json
          python examples/diag_r2.py --profile R2_ZERO_INCLUSIVE --out /tmp/r2-zero-api.json
          python -m unittest discover -s scripts/codec_feedback -p test_diagnostic.py -v
      - name: Check attribution codec, fixed-response identities and API on CPU
        run: |
          python -m unittest discover -s tests -p 'test_codec_r4_rne.py' -v
          python -m unittest discover -s tests -p 'test_calibration_r4.py' -v
          python -m unittest discover -s tests -p 'test_diag_r4*.py' -v
          python -m pytest -q tests/test_diag_r4_cost.py tests/test_diag_r4_cost_analysis.py tests/test_diag_r4_cost_renderer.py
          python examples/diag_r4.py --method B4 --layer 0
          python -m unittest discover -s tests -p 'test_grid_codec.py' -v
