[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rtpa-research"
version = "1.0.0"
description = "CPU-verifiable research snapshot for fixed recurrent-state precision allocation"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "tokenizers==0.22.2"]

[project.scripts]
rtpa-research = "rtpa_research.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rtpa_research"]
