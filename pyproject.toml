[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "rtpa-research"
version = "1.1.0rc1"
description = "Output-aware recurrent-state quantization with reproducible evidence and GDN operators"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "tokenizers==0.22.2"]

[project.optional-dependencies]
gpu = ["torch==2.11.0", "transformers==5.9.0"]
plots = ["matplotlib==3.10.9"]

[project.scripts]
rtpa-research = "rtpa_research.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rtpa_research"]

[tool.setuptools.cmdclass]
build_py = "rtpa_research._build.BuildEvidence"
