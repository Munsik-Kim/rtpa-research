[build-system]
requires = ["setuptools==83.0.0", "wheel==0.48.0", "packaging==26.3"]
build-backend = "rtpa_research.publication_build"
backend-path = ["src"]

[project]
name = "rtpa-research"
version = "1.3.1.dev0"
description = "Output-aware recurrent-state quantization with reproducible evidence and GDN operators"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.11"
dependencies = ["numpy==1.26.4", "tokenizers==0.22.2"]

[project.optional-dependencies]
gpu = ["torch==2.11.0", "transformers==5.9.0"]
plots = ["matplotlib==3.10.9"]
calibration = ["scipy==1.17.1"]
test = ["scipy==1.17.1", "pytest==9.1.1"]

[project.scripts]
rtpa-research = "rtpa_research.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["rtpa_research"]

[tool.setuptools]
include-package-data = false

[tool.setuptools.cmdclass]
build_py = "rtpa_research.publication_build.BuildEvidence"
